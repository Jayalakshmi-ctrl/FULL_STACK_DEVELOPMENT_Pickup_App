<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neem sapling">
  <defs>
    <linearGradient id="pot" x1="148" y1="300" x2="364" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="leaf" x1="160" y1="140" x2="370" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#86EFAC" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mud" x1="150" y1="420" x2="360" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92400E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A16207" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="592" height="592" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="48" fill="#ECFDF5" />

  <!-- mud -->
  <path d="M120 418 C150 388, 196 372, 250 372 C318 372, 368 398, 398 438 C356 468, 308 482, 250 482 C196 482, 150 462, 120 418Z"
        fill="url(#mud)" opacity="0.82"/>

  <!-- pot -->
  <g filter="url(#shadow)">
    <path d="M256 430 C196 430, 156 392, 156 344 L156 318 H356 L356 344 C356 392, 316 430, 256 430Z" fill="url(#pot)"/>
    <path d="M156 318 C156 294, 176 274, 200 274 H312 C336 274, 356 294, 356 318 Z" fill="#0B1220" opacity="0.10"/>
  </g>

  <!-- trunk -->
  <path d="M256 314 C256 258, 248 206, 232 164" stroke="#166534" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round"/>

  <!-- neem leaflets -->
  <g fill="url(#leaf)" opacity="0.95">
    <path d="M244 238 C210 232, 180 244, 160 268 C194 284, 224 280, 250 260 Z"/>
    <path d="M266 228 C292 196, 332 188, 376 206 C356 242, 316 260, 280 254 Z"/>
    <path d="M236 198 C208 178, 176 178, 146 196 C170 226, 202 238, 232 230 Z" opacity="0.9"/>
    <path d="M272 192 C286 160, 320 148, 360 156 C350 196, 318 216, 286 212 Z" opacity="0.9"/>
    <path d="M250 164 C224 140, 204 140, 180 156 C198 186, 222 198, 246 192 Z" opacity="0.88"/>
    <path d="M272 160 C290 132, 318 124, 346 136 C336 170, 310 188, 284 186 Z" opacity="0.88"/>
  </g>
</svg>

