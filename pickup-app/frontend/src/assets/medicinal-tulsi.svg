<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tulsi sapling">
  <defs>
    <linearGradient id="pot" x1="140" y1="300" x2="372" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="leaf" x1="180" y1="120" x2="350" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mud" x1="150" y1="420" x2="360" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92400E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A16207" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="592" height="592" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="48" fill="#ECFDF5" />

  <!-- mud mound -->
  <path d="M120 418 C150 388, 196 372, 250 372 C318 372, 368 398, 398 438 C356 468, 308 482, 250 482 C196 482, 150 462, 120 418Z"
        fill="url(#mud)" opacity="0.82"/>

  <!-- pot -->
  <g filter="url(#shadow)">
    <path d="M256 430 C196 430, 156 392, 156 344 L156 318 H356 L356 344 C356 392, 316 430, 256 430Z" fill="url(#pot)"/>
    <path d="M156 318 C156 294, 176 274, 200 274 H312 C336 274, 356 294, 356 318 Z" fill="#0B1220" opacity="0.10"/>
  </g>

  <!-- stem -->
  <path d="M256 310 C256 264, 250 216, 234 174" stroke="#166534" stroke-opacity="0.6" stroke-width="14" stroke-linecap="round"/>

  <!-- tulsi leaves (cluster) -->
  <path d="M250 236 C214 220, 184 226, 166 254 C192 284, 230 288, 256 268 Z" fill="url(#leaf)"/>
  <path d="M274 228 C296 196, 332 188, 372 206 C356 244, 320 262, 284 256 Z" fill="url(#leaf)"/>
  <path d="M242 190 C220 160, 184 154, 148 172 C166 212, 204 230, 234 222 Z" fill="url(#leaf)"/>
  <path d="M266 178 C280 142, 316 128, 356 142 C350 186, 318 206, 286 204 Z" fill="url(#leaf)" opacity="0.92"/>
</svg>

