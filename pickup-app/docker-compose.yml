services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: ./services/auth-service
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  pickups-service:
    build:
      context: ./services/pickups-service
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ECO_POINTS_PER_KG: ${ECO_POINTS_PER_KG:-100}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped

  gateway-service:
    build:
      context: ./services/gateway-service
    env_file:
      - ./.env
    environment:
      AUTH_SERVICE_BASE_URL: http://auth-service:8001
      PICKUPS_SERVICE_BASE_URL: http://pickups-service:8002
    depends_on:
      auth-service:
        condition: service_started
      pickups-service:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Dev server proxies /api → gateway (browser stays on :5173 only; fixes CORS / fetch issues).
      VITE_PROXY_TARGET: http://gateway-service:8000
    depends_on:
      - gateway-service
    ports:
      - "5173:5173"

volumes:
  pgdata:

